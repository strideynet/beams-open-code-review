name: OCR review in a Teleport Beam

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TELEPORT_PROXY_ADDR: square-lake.beams.sh:443
  TELEPORT_JOIN_TOKEN: ocr-reviewer
  TSH_VERSION: 18.11.10
  OCR_VERSION: v1.13.12
  OCR_MODEL: ${{ vars.OCR_MODEL || 'claude-opus-5-5' }}

defaults:
  run:
    shell: bash

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: src
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: alibaba/open-code-review
          ref: ${{ env.OCR_VERSION }}
          path: ocr
          sparse-checkout: scripts/github-actions
          persist-credentials: false

      - uses: teleport-actions/setup@v2
        with:
          version: ${{ env.TSH_VERSION }}

      # Released tbot can't issue certs for direct-role-assignment bots, so
      # shadow it with tbot built from the tenant's version (bin/README.md).
      - name: Install committed tbot
        run: |
          mkdir -p "$RUNNER_TEMP/tbot"
          gunzip -c src/bin/tbot.gz > "$RUNNER_TEMP/tbot/tbot"
          chmod +x "$RUNNER_TEMP/tbot/tbot"
          echo "$RUNNER_TEMP/tbot" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tbot/tbot" version

      - uses: teleport-actions/auth@v2
        with:
          proxy: ${{ env.TELEPORT_PROXY_ADDR }}
          token: ${{ env.TELEPORT_JOIN_TOKEN }}
          certificate-ttl: 1h
          allow-reissue: true

      - name: Create beam
        run: |
          tsh beams add --no-console --roles=beam-user --no-share-connected-accounts -f json | tee beam.json
          beam=$(jq -er '.uuid // .id' beam.json)
          echo "BEAM=$beam" >> "$GITHUB_ENV"

      - name: Copy PR checkout into beam
        run: |
          tar -C src --exclude=./bin -czf src.tgz .
          tsh beams scp src.tgz "$BEAM:/tmp/src.tgz"
          tsh beams exec "$BEAM" 'mkdir -p ~/work && tar -C ~/work -xzf /tmp/src.tgz'

      - name: Install OCR in beam
        run: |
          tsh beams exec "$BEAM" "git --version && curl -fsSL https://raw.githubusercontent.com/alibaba/open-code-review/$OCR_VERSION/install.sh | OCR_VERSION=$OCR_VERSION OCR_INSTALL_DIR=\$HOME/.local/bin sh"

      - name: Run OCR in beam
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE=$(git -C src merge-base "$BASE_SHA" "$HEAD_SHA")
          # The beam proxy injects the real API key; OCR only needs a non-empty token.
          tsh beams exec "$BEAM" "bash -lc 'cd ~/work && ANTHROPIC_AUTH_TOKEN=unused ANTHROPIC_MODEL=$OCR_MODEL ~/.local/bin/ocr review --from $MERGE_BASE --to $HEAD_SHA --audience agent --format json > /tmp/ocr-result.json 2> /tmp/ocr-stderr.log'" || status=$?
          tsh beams scp "$BEAM:/tmp/ocr-stderr.log" /tmp/ocr-stderr.log && cat /tmp/ocr-stderr.log
          tsh beams scp "$BEAM:/tmp/ocr-result.json" /tmp/ocr-result.json
          exit "${status:-0}"

      - name: Collect OCR logs from beam
        if: ${{ always() && env.BEAM != '' }}
        run: |
          mkdir -p ocr-logs
          cp beam.json /tmp/ocr-result.json /tmp/ocr-stderr.log ocr-logs/ 2>/dev/null || true
          tsh beams exec "$BEAM" 'tar -C ~ -czf /tmp/ocr-sessions.tgz --exclude=.opencodereview/auth .opencodereview' &&
            tsh beams scp "$BEAM:/tmp/ocr-sessions.tgz" ocr-logs/ocr-sessions.tgz

      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.BEAM != '' }}
        with:
          name: ocr-logs
          path: ocr-logs/
          if-no-files-found: warn

      - name: Post review comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { runPostReviewComments } = require(`${process.env.GITHUB_WORKSPACE}/ocr/scripts/github-actions/post-review-comments.js`);
            await runPostReviewComments({
              github, context, core, fs,
              prNumber: context.issue.number,
              resultPath: '/tmp/ocr-result.json',
              stderrPath: '/tmp/ocr-stderr.log',
              stickySummary: true,
              incremental: false,
              incrementalOverlapThreshold: 0.6,
              reviewCommentBatchSize: 50,
              routeSeverityBelow: '',
              routeCategories: '',
              checkpointEnabled: false,
              resolveOutdated: 'false',
            });

      - name: Delete beam
        if: ${{ always() && env.BEAM != '' }}
        run: tsh beams rm "$BEAM"
